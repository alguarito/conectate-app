<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>IE Sor María Juliana - Tecnología e Informática</title>
    <!-- Performance Preconnect Hints -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://unpkg.com">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- BoxIcons para iconos -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css?v=5.0">
    <!-- PWA Config -->
    <link rel="manifest" href="manifest.json?v=5">
    <link rel="icon" type="image/png" href="IMAGENES/LOGO 1.png">
    <link rel="apple-touch-icon" href="IMAGENES/ID_CONECTATE.png">
    <meta name="msapplication-TileImage" content="IMAGENES/ID_CONECTATE.png">
    <meta name="theme-color" content="#a855f7">
    <!-- Chart.js for Data Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="app-container glass-panel">
        <aside class="sidebar" style="overflow-y: auto;">
            <div class="logo-container" id="logo-home-btn" title="Volver al Inicio">
                <div class="logo-img-wrapper">
                    <img src="IMAGENES/LOGO 1.png?v=7" alt="IE Sor Maria Juliana" class="logo-img">
                </div>
                <h1 class="logo-title">I.E. SOR MARÍA JULIANA</h1>
                <p class="logo-subtitle">Tecnología e Informática</p>
            </div>
            
            <div id="sidebar-menus">
                <nav class="agent-nav" id="main-nav">
                <p class="nav-title">GRADOS ACADÉMICOS</p>
                <button class="nav-btn active" data-content="octavo">
                    <i class='bx bx-book-open'></i>
                    <span>Grado Octavo</span>
                    <div class="tooltip">Tutor: Agente Maker</div>
                </button>
                <button class="nav-btn" data-content="noveno">
                    <i class='bx bx-laptop'></i>
                    <span>Grado Noveno</span>
                    <div class="tooltip">Tutor: Agente UI/UX</div>
                </button>
                <button class="nav-btn" data-content="decimo">
                    <i class='bx bx-code-block'></i>
                    <span>Grado Décimo</span>
                    <div class="tooltip">Tutor: Agente Coder</div>
                </button>
                <button class="nav-btn" data-content="undecimo">
                    <i class='bx bx-code-alt'></i>
                    <span>Grado Undécimo</span>
                    <div class="tooltip">Tutor: Agente Coder</div>
                </button>

                <p class="nav-title" style="margin-top: 16px;">MÁS RECURSOS</p>
                <button class="nav-btn" data-content="interes">
                    <i class='bx bx-bulb'></i>
                    <span>Recursos</span>
                    <div class="tooltip">Publicaciones y Semilleros</div>
                </button>
                <button class="nav-btn" data-content="proyectos">
                    <i class='bx bx-trophy'></i>
                    <span>Proyectos TIC</span>
                    <div class="tooltip">Feria de la Ciencia</div>
                </button>
                <button class="nav-btn" data-content="herramientas">
                    <i class='bx bx-wrench'></i>
                    <span>Herramientas</span>
                    <div class="tooltip">Plataformas Externas</div>
                </button>
                </nav>
            </div>
            
            <div class="sidebar-footer">
                <div class="user-info">
                    <img src="IMAGENES/ID_CONECTATE.png" alt="Usuario" class="user-avatar" id="curator-avatar">
                    <div class="user-details" id="static-profile-details">
                        <!-- Perfil Estático de Autor -->
                    </div>
                </div>
            </div>
        </aside>

        <main class="content-area">
            <header class="top-bar">
                <div class="search-box glass-panel" style="position: relative;">
                    <i class='bx bx-search'></i>
                    <input type="text" id="global-search-input" placeholder="Buscar temas, guías o herramientas..." autocomplete="off">
                    <div id="global-search-dropdown" class="glass-dropdown" style="display: none;"></div>
                </div>
                <div class="header-actions">
                    <button class="icon-btn glass-panel" id="home-btn" title="Ir al Inicio">
                        <i class='bx bx-home-alt'></i>
                    </button>
                    <button class="icon-btn glass-panel" id="update-app-btn" title="Buscar actualizaciones">
                        <i class='bx bx-bell'></i>
                        <span id="update-dot" style="display: none;"></span>
                    </button>
                    <button class="icon-btn glass-panel" id="theme-toggle"><i class='bx bx-moon'></i></button>
                </div>
            </header>
            
            <div class="main-viewer" id="agent-content">
                <!-- Content will be injected here by JS -->
            </div>

            <!-- Selector de Grados para Móvil -->
            <div id="mobile-grade-picker" class="glass-panel" style="display: none; padding: 20px;">
                <h3 style="text-align: center; margin-bottom: 20px; font-family: var(--font-heading);">Selecciona tu Grado</h3>
                <div class="dashboard-grid" style="grid-template-columns: repeat(2, 1fr); gap: 12px;">
                    <div class="feature-card glass-panel" onclick="navigateTo('octavo')"><span>Octavo</span></div>
                    <div class="feature-card glass-panel" onclick="navigateTo('noveno')"><span>Noveno</span></div>
                    <div class="feature-card glass-panel" onclick="navigateTo('decimo')"><span>Décimo</span></div>
                    <div class="feature-card glass-panel" onclick="navigateTo('undecimo')"><span>Undécimo</span></div>
                </div>
            </div>
        </main>
    </div>

    <nav class="mobile-nav">
        <button class="m-btn active" data-content="home"><i class='bx bx-home-alt'></i><span>Inicio</span></button>
        <button class="m-btn" data-content="grados-picker"><i class='bx bx-grid-alt'></i><span>Grados</span></button>
        <button class="m-btn" data-content="herramientas"><i class='bx bx-wrench'></i><span>Herramientas</span></button>
        <button class="m-btn" data-content="interes"><i class='bx bx-bulb'></i><span>Recursos</span></button>
    </nav>

    <script src="script.js?v=5.0"></script>
    <script src="chat-tesla.js?v=5.0"></script>
</body>
</html>
